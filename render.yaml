services:
  - type: web
    name: sgas-postgraduate-attendance
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: QR_HMAC_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
